<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Méthodes de Paiement - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="header">
            <h1>Liste des Méthodes de Paiement</h1>
            <a href="/methodes-paiement/nouveau" class="btn">+ Ajouter une Méthode</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Libellé</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${methodesPaiement == null or methodesPaiement.isEmpty()}">
                        <td colspan="3"><div class="empty-state"><p>Aucune méthode trouvée</p></div></td>
                    </tr>
                    <tr th:each="mp : ${methodesPaiement}">
                        <td th:text="${mp.idMethodePaiement}"></td>
                        <td th:text="${mp.libelle}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/methodes-paiement/edit/{id}(id=${mp.idMethodePaiement})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/methodes-paiement/delete/{id}(id=${mp.idMethodePaiement})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
</head>
