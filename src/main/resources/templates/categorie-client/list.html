<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories Client - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="header">
            <h1>Liste des Catégories Client</h1>
            <a href="/categorie-clients/nouveau" class="btn">+ Ajouter une Catégorie</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Libellé</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${categorieClients == null or categorieClients.isEmpty()}">
                        <td colspan="4"><div class="empty-state"><p>Aucune catégorie trouvée</p></div></td>
                    </tr>
                    <tr th:each="categorieClient : ${categorieClients}">
                        <td th:text="${categorieClient.idCategorieClient}"></td>
                        <td th:text="${categorieClient.libelle}"></td>
                        <td th:text="${categorieClient.description != null ? categorieClient.description : '-'}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/categorie-clients/edit/{id}(id=${categorieClient.idCategorieClient})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/categorie-clients/delete/{id}(id=${categorieClient.idCategorieClient})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
