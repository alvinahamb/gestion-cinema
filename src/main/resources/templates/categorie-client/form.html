<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter/Modifier Catégorie Client - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="form-container">
            <h1 th:if="${categorieClient == null or categorieClient.idCategorieClient == null}">Ajouter une Catégorie Client</h1>
            <h1 th:if="${categorieClient != null and categorieClient.idCategorieClient != null}">Modifier une Catégorie Client</h1>
            <form th:action="@{/categorie-clients/save}" method="post">
                <input type="hidden" name="idCategorieClient" th:value="${categorieClient != null and categorieClient.idCategorieClient != null ? categorieClient.idCategorieClient : ''}"/>
                <div class="form-group">
                    <label for="libelle">Libellé *</label>
                    <input type="text" id="libelle" name="libelle" th:value="${categorieClient != null ? categorieClient.libelle : ''}" required/>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" th:text="${categorieClient != null ? categorieClient.description : ''}"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Enregistrer</button>
                    <a href="/categorie-clients" class="btn btn-cancel" style="text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
