<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types Statut - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="header">
            <h1>Liste des Types Statut</h1>
            <a href="/type-statuts/nouveau" class="btn">+ Ajouter un Type</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Libellé</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${typeStatuts == null or typeStatuts.isEmpty()}">
                        <td colspan="3"><div class="empty-state"><p>Aucun type statut trouvé</p></div></td>
                    </tr>
                    <tr th:each="typeStatut : ${typeStatuts}">
                        <td th:text="${typeStatut.idTypeStatut}"></td>
                        <td th:text="${typeStatut.libelle}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/type-statuts/edit/{id}(id=${typeStatut.idTypeStatut})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/type-statuts/delete/{id}(id=${typeStatut.idTypeStatut})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
