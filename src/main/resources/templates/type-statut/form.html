<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter/Modifier Type Statut - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="form-container">
            <h1 th:if="${typeStatut == null or typeStatut.idTypeStatut == null}">Ajouter un Type Statut</h1>
            <h1 th:if="${typeStatut != null and typeStatut.idTypeStatut != null}">Modifier un Type Statut</h1>
            <form th:action="@{/type-statuts/save}" method="post">
                <input type="hidden" name="idTypeStatut" th:value="${typeStatut != null and typeStatut.idTypeStatut != null ? typeStatut.idTypeStatut : ''}"/>
                <div class="form-group">
                    <label for="libelle">Libellé *</label>
                    <input type="text" id="libelle" name="libelle" th:value="${typeStatut != null ? typeStatut.libelle : ''}" required/>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Enregistrer</button>
                    <a href="/type-statuts" class="btn btn-cancel" style="text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
