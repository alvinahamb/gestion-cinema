<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salles - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div class="navbar">
        <h2>🎪 Gestion des Salles</h2>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/">Accueil</a>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>Liste des Salles</h1>
            <a href="/salles/nouveau" class="btn">+ Ajouter une Salle</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Capacité</th>
                        <th>Lignes</th>
                        <th>Colonnes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${salles == null or salles.isEmpty()}">
                        <td colspan="6"><div class="empty-state"><p>Aucune salle trouvée</p></div></td>
                    </tr>
                    <tr th:each="salle : ${salles}">
                        <td th:text="${salle.idSalle}"></td>
                        <td th:text="${salle.nomSalle}"></td>
                        <td th:text="${salle.capacite}"></td>
                        <td th:text="${salle.ligne}"></td>
                        <td th:text="${salle.colonne}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/salles/edit/{id}(id=${salle.idSalle})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/salles/delete/{id}(id=${salle.idSalle})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
</head>
