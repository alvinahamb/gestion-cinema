<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Places Réservation - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div class="navbar">
        <h2>🎫 Places Réservation</h2>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/">Accueil</a>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>Liste des Places Réservation</h1>
            <a href="/reservation-places/nouveau" class="btn">+ Ajouter</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Réservation</th>
                        <th>Place</th>
                        <th>Catégorie Client</th>
                        <th>Prix</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${reservationPlaces == null or reservationPlaces.isEmpty()}">
                        <td colspan="6"><div class="empty-state"><p>Aucune place réservation trouvée</p></div></td>
                    </tr>
                    <tr th:each="rp : ${reservationPlaces}">
                        <td th:text="${rp.id}"></td>
                        <td th:text="${rp.reservation != null ? rp.reservation.idReservation : 'N/A'}"></td>
                        <td th:text="${rp.place != null ? rp.place.idPlace : 'N/A'}"></td>
                        <td th:text="${rp.categorieClient != null ? rp.categorieClient.libelle : 'N/A'}"></td>
                        <td th:text="${rp.prix}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/reservation-places/edit/{id}(id=${rp.id})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/reservation-places/delete/{id}(id=${rp.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script th:src="@{/js/format-numbers.js}"></script>
</body>
</html>
