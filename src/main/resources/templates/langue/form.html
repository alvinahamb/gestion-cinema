<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Langue - Gestion Cinéma</title>
    <link rel="stylesheet" href="/css/langue/form.css">
    
</head>
<body>
    <div class="navbar">
        <h2>🗣️ Ajouter/Modifier Langue</h2>
        <div>
            <a href="/langues">Langues</a>
            <a href="/dashboard">Dashboard</a>
        </div>
    </div>

    <div class="container">
        <div class="form-container">
            <h1 th:text="${langue == null ? 'Ajouter une Langue' : 'Modifier Langue'}"></h1>
            
            <form th:action="${langue == null ? '/langues/save' : '/langues/update'}" method="post">
                <input type="hidden" name="id" th:value="${langue?.idLangue}">
                
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required th:value="${langue?.nom}">
                </div>

                <div class="form-group">
                    <label for="code">Code</label>
                    <input type="text" id="code" name="code" required th:value="${langue?.code}" placeholder="ex: FR, EN">
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-submit">Enregistrer</button>
                    <a href="/langues" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">
                        <button type="button" class="btn-cancel">Annuler</button>
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
</head>
