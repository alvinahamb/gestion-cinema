<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div class="navbar">
        <h2>📊 Gestion des Status</h2>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/">Accueil</a>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>Liste des Status</h1>
            <a href="/status/nouveau" class="btn">+ Ajouter un Status</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Libellé</th>
                        <th>Code</th>
                        <th>Ordre</th>
                        <th>Type Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${statusList == null or statusList.isEmpty()}">
                        <td colspan="6"><div class="empty-state"><p>Aucun status trouvé</p></div></td>
                    </tr>
                    <tr th:each="status : ${statusList}">
                        <td th:text="${status.idStatus}"></td>
                        <td th:text="${status.libelle}"></td>
                        <td th:text="${status.code}"></td>
                        <td th:text="${status.ordre}"></td>
                        <td th:text="${status.typeStatut != null ? status.typeStatut.libelle : '-'}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/status/edit/{id}(id=${status.idStatus})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/status/delete/{id}(id=${status.idStatus})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
