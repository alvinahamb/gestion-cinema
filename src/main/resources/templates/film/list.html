<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Films - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/film/list.css}">
</head>
<body>
    <div class="navbar">
        <h2>🎬 Gestion des Films</h2>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/">Accueil</a>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>Liste des Films</h1>
            <a href="/films/nouveau" class="btn">+ Ajouter un Film</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Titre</th>
                        <th>Durée</th>
                        <th>Classification</th>
                        <th>Date Sortie</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${films == null or films.isEmpty()}">
                        <td colspan="6"><div class="empty-state"><p>Aucun film trouvé</p></div></td>
                    </tr>
                    <tr th:each="film : ${films}">
                        <td th:text="${film.idFilm}"></td>
                        <td th:text="${film.titre}"></td>
                        <td th:text="${film.duree}"></td>
                        <td th:text="${film.classificationAge}"></td>
                        <td th:text="${film.dateSortie}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/films/edit/{id}(id=${film.idFilm})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/films/delete/{id}(id=${film.idFilm})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
</head>
