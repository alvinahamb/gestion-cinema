<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter/Modifier Type de Place - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="form-container">
            <h1 th:if="${typePlace == null or typePlace.idTypePlace == null}">Ajouter un Type de Place</h1>
            <h1 th:if="${typePlace != null and typePlace.idTypePlace != null}">Modifier un Type de Place</h1>
            <form th:action="@{/types-places/save}" method="post">
                <input type="hidden" name="idTypePlace" th:value="${typePlace != null and typePlace.idTypePlace != null ? typePlace.idTypePlace : ''}"/>
                <div class="form-group">
                    <label for="libelle">Libellé du Type *</label>
                    <input type="text" id="libelle" name="libelle" th:value="${typePlace != null ? typePlace.libelle : ''}" required/>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" th:text="${typePlace != null ? typePlace.description : ''}"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Enregistrer</button>
                    <a href="/types-places" class="btn btn-cancel" style="text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
