<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter/Modifier Réservation - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="form-container">
            <h1 th:if="${reservation == null or reservation.idReservation == null}">Ajouter une Réservation</h1>
            <h1 th:if="${reservation != null and reservation.idReservation != null}">Modifier une Réservation</h1>
            <form th:action="@{/reservations/save}" method="post">
                <input type="hidden" name="idReservation" th:value="${reservation != null and reservation.idReservation != null ? reservation.idReservation : ''}"/>
                <div class="form-group">
                    <label for="client">Client *</label>
                    <select id="client" name="clientId" required>
                        <option value="">-- Sélectionner un client --</option>
                        <option th:each="client : ${clients}" 
                                th:value="${client.idClient}" 
                                th:text="${client.nom + ' ' + client.prenom}"
                                th:selected="${reservation != null and reservation.client != null and reservation.client.idClient == client.idClient}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="seance">Séance *</label>
                    <select id="seance" name="seanceId" required>
                        <option value="">-- Sélectionner une séance --</option>
                        <option th:each="seance : ${seances}" 
                                th:value="${seance.idSeance}" 
                                th:text="${seance.filmVersion != null ? seance.filmVersion.film.titre : 'Film inconnu'} + ' - ' + ${seance.dateSeance} + ' ' + ${seance.heureDebut}"
                                th:selected="${reservation != null and reservation.seance != null and reservation.seance.idSeance == seance.idSeance}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dateReservation">Date de Réservation *</label>
                    <input type="datetime-local" id="dateReservation" name="dateReservation" th:value="${reservation != null and reservation.dateReservation != null ? reservation.dateReservation : ''}" required/>
                </div>
                <div class="form-group">
                    <label for="total">Total (€) *</label>
                    <input type="number" id="total" name="total" step="0.01" th:value="${reservation != null ? reservation.total : ''}" required/>
                </div>
                <div class="form-group">
                    <label for="remise">Remise (€)</label>
                    <input type="number" id="remise" name="remise" step="0.01" th:value="${reservation != null ? reservation.remise : '0.00'}"/>
                </div>
                <div class="form-group">
                    <label for="datePaiementPrevu">Date de Paiement Prévue</label>
                    <input type="date" id="datePaiementPrevu" name="datePaiementPrevu" th:value="${reservation != null and reservation.datePaiementPrevu != null ? reservation.datePaiementPrevu : ''}"/>
                </div>
                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" name="statusId" required>
                        <option value="">-- Sélectionner un status --</option>
                        <option th:each="status : ${statusList}" 
                                th:value="${status.idStatus}" 
                                th:text="${status.libelle}"
                                th:selected="${reservation != null and reservation.status != null and reservation.status.idStatus == status.idStatus}">
                        </option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Enregistrer</button>
                    <a href="/reservations" class="btn btn-cancel" style="text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
</head>
