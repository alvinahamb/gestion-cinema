<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarifs Places - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div class="navbar">
        <h2>💰 Gestion des Tarifs Places</h2>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/">Accueil</a>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>Liste des Tarifs Places</h1>
            <a href="/tarif-places/nouveau" class="btn">+ Ajouter un Tarif</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type de Place</th>
                        <th>Prix</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${tarifPlaces == null or tarifPlaces.isEmpty()}">
                        <td colspan="4"><div class="empty-state"><p>Aucun tarif trouvé</p></div></td>
                    </tr>
                    <tr th:each="tarifPlace : ${tarifPlaces}">
                        <td th:text="${tarifPlace.idTarif}"></td>
                        <td th:text="${tarifPlace.libelleTypePlace}"></td>
                        <td th:text="${tarifPlace.prix}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/tarif-places/edit/{id}(id=${tarifPlace.idTarif})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/tarif-places/delete/{id}(id=${tarifPlace.idTarif})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
