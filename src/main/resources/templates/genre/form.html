<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter/Modifier Genre - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="form-container">
            <h1 th:if="${genre == null or genre.idGenre == null}">Ajouter un Genre</h1>
            <h1 th:if="${genre != null and genre.idGenre != null}">Modifier un Genre</h1>
            <form th:action="@{/genres/save}" method="post">
                <input type="hidden" name="idGenre" th:value="${genre != null and genre.idGenre != null ? genre.idGenre : ''}"/>
                <div class="form-group">
                    <label for="libelle">Libellé du Genre *</label>
                    <input type="text" id="libelle" name="libelle" th:value="${genre != null ? genre.libelle : ''}" required/>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Enregistrer</button>
                    <a href="/genres" class="btn btn-cancel" style="text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
</head>
