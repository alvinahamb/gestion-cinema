<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${produit != null} ? 'Modifier Produit' : 'Nouveau Produit'">Produit</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <div class="header">
            <h1 th:text="${produit != null} ? 'Modifier le Produit' : 'Nouveau Produit'">Produit</h1>
        </div>
        
        <div class="form-container">
            <form th:action="@{/produits/save}" method="post">
                <input type="hidden" name="id" th:value="${produit != null} ? ${produit.id} : ''">
                
                <div class="form-group">
                    <label for="nom">Nom du produit *</label>
                    <input type="text" id="nom" name="nom" th:value="${produit != null} ? ${produit.nom} : ''" required>
                </div>
                
                <div class="form-group">
                    <label for="prix">Prix (€) *</label>
                    <input type="number" id="prix" name="prix" step="0.01" min="0" th:value="${produit != null} ? ${produit.prix} : ''" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a href="/produits" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
