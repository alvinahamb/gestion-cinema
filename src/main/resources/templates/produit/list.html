<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div class="navbar">
        <h2>🛒 Gestion des Produits</h2>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/">Accueil</a>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>Liste des Produits</h1>
            <a href="/produits/nouveau" class="btn">+ Ajouter un Produit</a>
        </div>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prix (€)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${produits == null or produits.isEmpty()}">
                        <td colspan="4"><div class="empty-state"><p>Aucun produit trouvé</p></div></td>
                    </tr>
                    <tr th:each="produit : ${produits}">
                        <td th:text="${produit.id}"></td>
                        <td th:text="${produit.nom}"></td>
                        <td th:text="${produit.prix}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/produits/edit/{id}(id=${produit.id})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/produits/delete/{id}(id=${produit.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
