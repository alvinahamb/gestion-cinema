<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Sidebar Fragment -->
    <div th:fragment="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>🎬 Cinéma</h2>
        </div>
        
        <nav class="sidebar-nav">
            <a href="/seances" class="sidebar-link" th:classappend="${#strings.contains(#request.requestURI, '/seances') ? 'active' : ''}">
                <span class="icon">⏰</span>
                <span>Séances</span>
            </a>
            
            <a href="/reservations" class="sidebar-link" th:classappend="${#strings.contains(#request.requestURI, '/reservations') ? 'active' : ''}">
                <span class="icon">🎫</span>
                <span>Réservations</span>
            </a>
            
            <a href="/paiement" class="sidebar-link" th:classappend="${#strings.contains(#request.requestURI, '/paiement') ? 'active' : ''}">
                <span class="icon">💳</span>
                <span>Paiements</span>
            </a>
            
            <a href="/ticket" class="sidebar-link" th:classappend="${#strings.contains(#request.requestURI, '/ticket') ? 'active' : ''}">
                <span class="icon">🎟️</span>
                <span>Tickets</span>
            </a>
            
            <div class="sidebar-divider"></div>
            
            <a href="/produits" class="sidebar-link" th:classappend="${#strings.contains(#request.requestURI, '/produits') ? 'active' : ''}">
                <span class="icon">🛒</span>
                <span>Produits</span>
            </a>
            
            <a href="/stocks" class="sidebar-link" th:classappend="${#strings.contains(#request.requestURI, '/stocks') ? 'active' : ''}">
                <span class="icon">📦</span>
                <span>Stock</span>
            </a>
            
            <a href="/ventes-produits" class="sidebar-link" th:classappend="${#strings.contains(#request.requestURI, '/ventes-produits') ? 'active' : ''}">
                <span class="icon">🛍️</span>
                <span>Ventes Produits</span>
            </a>
            
            <a href="/paiements-produits" class="sidebar-link" th:classappend="${#strings.contains(#request.requestURI, '/paiements-produits') ? 'active' : ''}">
                <span class="icon">💰</span>
                <span>Paiements Produits</span>
            </a>
            
            <div class="sidebar-divider"></div>
            
            <a href="/dashboard" class="sidebar-link" th:classappend="${#strings.contains(#request.requestURI, '/dashboard') ? 'active' : ''}">
                <span class="icon">⚙️</span>
                <span>Paramètres</span>
            </a>
            
            <a href="/" class="sidebar-link">
                <span class="icon">🏠</span>
                <span>Accueil</span>
            </a>
        </nav>
    </div>
</body>
</html>
