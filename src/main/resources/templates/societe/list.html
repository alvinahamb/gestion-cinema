<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sociétés - Gestion Cinéma</title>
    <link rel="stylesheet" th:href="@{/css/shared-list-form.css}">
</head>
<body>
    <div class="navbar">
        <h2>🏢 Gestion des Sociétés</h2>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/">Accueil</a>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>Liste des Sociétés</h1>
            <a href="/societes/nouveau" class="btn">+ Ajouter une Société</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Téléphone</th>
                        <th>Adresse</th>
                        <th>Date Ajout</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${societes == null or societes.isEmpty()}">
                        <td colspan="6"><div class="empty-state"><p>Aucune société trouvée</p></div></td>
                    </tr>
                    <tr th:each="societe : ${societes}">
                        <td th:text="${societe.id}"></td>
                        <td th:text="${societe.nom}"></td>
                        <td th:text="${societe.telephone}"></td>
                        <td th:text="${societe.adresse}"></td>
                        <td th:text="${societe.dateAjout}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/societes/edit/{id}(id=${societe.id})}" class="btn btn-edit">Modifier</a>
                                <form th:action="@{/societes/delete/{id}(id=${societe.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
